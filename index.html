<!DOCTYPE html>
<html>
<head>
    <title>CSS Interactive Remote</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <style>
        body { margin: 0; padding: 0; background-color: #111; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; font-family: sans-serif; }
        .instruction { position: absolute; top: 40px; font-size: 24px; font-weight: bold; color: #888; text-align: center; }
        .arrow-container { display: flex; width: 100%; justify-content: space-between; padding: 0 40px; box-sizing: border-box; }
        .arrow { font-size: 80px; color: #444; user-select: none; }
        .swipe-area { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; }
    </style>
</head>
<body>
    <div class="instruction">Swipe to change product</div>
    <div class="arrow-container">
        <div class="arrow">❮</div>
        <div class="arrow">❯</div>
    </div>
    <div class="swipe-area" id="swipeArea"></div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const tvId = urlParams.get('id');
        const token = urlParams.get('token');
        const clientId = 'remote_' + Math.random().toString(36).substr(2, 9);
        
        if (tvId && token) {
            const client = new Paho.MQTT.Client('broker.hivemq.com', 8443, clientId);
            
            const sendCommand = (cmd) => {
                if (client.isConnected()) {
                    const topic = `css_signage/tv/${tvId}/remote`;
                    const payload = JSON.stringify({ action: cmd, token: token, remoteId: clientId });
                    const message = new Paho.MQTT.Message(payload);
                    message.destinationName = topic;
                    client.send(message);
                }
            };

            client.connect({
                useSSL: true,
                onSuccess: () => {
                    console.log('Connected to MQTT');
                    sendCommand('connected');
                },
                onFailure: (e) => console.log('Connection failed: ', e)
            });

            let touchstartX = 0;
            let touchendX = 0;
            const swipeArea = document.getElementById('swipeArea');

            swipeArea.addEventListener('touchstart', e => {
                touchstartX = e.changedTouches[0].screenX;
            }, false);

            swipeArea.addEventListener('touchend', e => {
                touchendX = e.changedTouches[0].screenX;
                const distance = touchendX - touchstartX;
                if (Math.abs(distance) > 50) { 
                    if (distance < 0) sendCommand('next');
                    else sendCommand('prev');
                }
            }, false);
        }
    </script>
</body>
</html>
